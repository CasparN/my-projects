name: Publish Field journal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: restyle-demo/package-lock.json
      - name: Install site dependencies
        run: npm ci
        working-directory: restyle-demo
      - name: Check content and templates
        run: npm run check
        working-directory: restyle-demo
      - name: Build public Field journal
        run: node scripts/build-public.mjs
        working-directory: restyle-demo
        env:
          SITE_BASE: /my-projects
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: restyle-demo/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
